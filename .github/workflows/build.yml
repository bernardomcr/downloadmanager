name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release

      - name: Testes
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Preparar vídeos (baixa yt-dlp e ffmpeg e extrai com o tar do Windows)
        shell: pwsh
        run: |
          build/Release/dm-cli.exe --preparar-videos "$env:RUNNER_TEMP\dm-dados"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\dm-dados\tools\yt-dlp.exe" --version
          & "$env:RUNNER_TEMP\dm-dados\tools\ffmpeg.exe" -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Regras (move para a subpasta e extrai com o tar do Windows)
        shell: pwsh
        run: |
          $base = "$env:RUNNER_TEMP\dm-regras"
          New-Item -ItemType Directory -Force "$base\origem" | Out-Null
          Set-Content "$base\origem\leia.txt" "oi"
          Compress-Archive "$base\origem\leia.txt" "$base\pacote.zip"
          Set-Content "$base\relatorio.pdf" "pdf"
          build/Release/dm-cli.exe --organizar "$base\relatorio.pdf" $base
          build/Release/dm-cli.exe --organizar "$base\pacote.zip" $base --extrair
          Get-ChildItem -Recurse $base | Select-Object -ExpandProperty FullName
          $ok = (Test-Path "$base\Documents\relatorio.pdf") -or (Test-Path "$base\Documentos\relatorio.pdf")
          $zip = Get-ChildItem -Recurse -Filter leia.txt $base | Where-Object { $_.Directory.Name -eq "pacote" }
          if (-not $ok -or -not $zip -or (Get-ChildItem -Recurse -Filter pacote.zip $base)) { exit 1 }

      - name: Testes da extensão
        run: node --test tests/extension_lib.test.cjs

      - name: Empacotar a extensão
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath build/Release/extensao-download-manager.zip

      - name: Publicar executáveis
        uses: actions/upload-artifact@v5
        with:
          name: DownloadManager
          path: |
            build/Release/DownloadManager.exe
            build/Release/dm-cli.exe
            build/Release/dm-host.exe
            build/Release/extensao-download-manager.zip
