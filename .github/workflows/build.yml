name: Build

on:
  push:
    branches: [main]
    tags: ['v*']  # tag vX.Y.Z: além do build, publica o release (a atualização automática lê o último)
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar o release (tag vX.Y.Z com a versão do CMakeLists.txt)
        type: boolean
        default: false

# Um push novo cancela o build anterior do mesmo branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30  # o build normal leva ~2 min; mais que isso é runner travado
    permissions:
      contents: write  # criar o release nas tags
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      # Release: push de uma tag vX.Y.Z, ou "Run workflow" com "publicar" marcado (o CI cria a tag).
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publicar == true }}
    steps:
      - uses: actions/checkout@v5

      - name: Conferir a versão (tag = CMakeLists.txt = extensão)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $cmake = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(DownloadManager VERSION ([0-9.]+)').Groups[1].Value
          $extension = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}".Substring(1) } else { $cmake }
          "tag $tag · CMake $cmake · extensão $extension"
          if ($tag -ne $cmake -or $tag -ne $extension) { exit 1 }
          gh release view "v$tag" 2>$null
          if ($LASTEXITCODE -eq 0) { "O release v$tag já existe: mude a versão antes de publicar."; exit 1 }
          "RELEASE_TAG=v$tag" | Out-File -Append $env:GITHUB_ENV
          $global:LASTEXITCODE = 0

      # Firefox só instala extensão assinada pela Mozilla. Precisa dos segredos AMO_JWT_ISSUER e AMO_JWT_SECRET
      # (addons.mozilla.org → Ferramentas → Gerenciar chaves de API); sem eles, o passo é pulado.
      - name: Assinar a extensão do Firefox (não listada)
        if: env.PUBLISH == 'true' && env.AMO_JWT_ISSUER != ''
        shell: pwsh
        run: |
          npx --yes web-ext@8 sign --source-dir extension --channel unlisted --artifacts-dir firefox `
            --api-key $env:AMO_JWT_ISSUER --api-secret $env:AMO_JWT_SECRET
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $xpi = Get-ChildItem firefox -Filter *.xpi | Select-Object -First 1
          Copy-Item $xpi.FullName firefox/download-manager.xpi
          "DM_FIREFOX_XPI=$((Resolve-Path firefox/download-manager.xpi).Path)" | Out-File -Append $env:GITHUB_ENV

      - name: Configurar
        shell: pwsh
        run: |
          $arguments = @("-S", ".", "-B", "build", "-A", "x64")
          if ($env:DM_FIREFOX_XPI) { $arguments += "-DDM_FIREFOX_XPI=$env:DM_FIREFOX_XPI" }
          cmake @arguments

      - name: Compilar
        run: cmake --build build --config Release

      - name: Testes
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Preparar vídeos (baixa yt-dlp e ffmpeg e extrai com o tar do Windows)
        shell: pwsh
        run: |
          build/Release/dm-cli.exe --preparar-videos "$env:RUNNER_TEMP\dm-dados"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\dm-dados\tools\yt-dlp.exe" --version
          & "$env:RUNNER_TEMP\dm-dados\tools\ffmpeg.exe" -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Regras (move para a subpasta e extrai com o extrator instalado, 7-Zip no runner)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $base = "$env:RUNNER_TEMP\dm-regras"
          build/Release/dm-cli.exe --extrator zip
          New-Item -ItemType Directory -Force "$base\origem" | Out-Null
          Set-Content "$base\origem\leia.txt" "oi"
          Set-Content "$base\origem\outro.txt" "oi"
          # Extrair inteligente: vários itens na raiz -> pasta com o nome; um item só -> ao lado do compactado.
          Compress-Archive "$base\origem\leia.txt", "$base\origem\outro.txt" "$base\pacote.zip"
          Compress-Archive "$base\origem\leia.txt" "$base\sozinho.zip"
          Rename-Item "$base\origem\leia.txt" "unico.txt"
          Compress-Archive "$base\origem\unico.txt" "$base\unico.zip"
          Set-Content "$base\relatorio.pdf" "pdf"
          build/Release/dm-cli.exe --organizar "$base\relatorio.pdf" $base
          build/Release/dm-cli.exe --organizar "$base\pacote.zip" $base --extrair
          build/Release/dm-cli.exe --organizar "$base\unico.zip" $base --extrair
          Get-ChildItem -Recurse $base | Select-Object -ExpandProperty FullName
          $ok = (Test-Path "$base\Documents\relatorio.pdf") -or (Test-Path "$base\Documentos\relatorio.pdf")
          $zip = Get-ChildItem -Recurse -Filter outro.txt $base | Where-Object { $_.Directory.Name -eq "pacote" }
          $single = Get-ChildItem -Recurse -Filter unico.txt $base | Where-Object { $_.Directory.Name -match "^Compact|^Compressed" }
          if (-not $ok -or -not $zip -or -not $single -or (Get-ChildItem -Recurse -Filter pacote.zip $base)) { exit 1 }

      - name: Instalador (instala e desinstala em silêncio)
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\Download Manager"
          Start-Process build/Release/DownloadManager-Setup.exe -ArgumentList /silencioso -Wait
          Get-ChildItem -Recurse $dir | Select-Object -ExpandProperty FullName
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DownloadManager"
          (Get-ItemProperty $key).DisplayVersion
          if (-not (Test-Path "$dir\DownloadManager.exe") -or -not (Test-Path "$dir\dm-host.exe") -or
              -not (Test-Path "$dir\extension\manifest.json") -or -not (Test-Path $key)) { exit 1 }
          Start-Process "$dir\uninstall.exe" -ArgumentList "/desinstalar", "/silencioso" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if ((Test-Path $dir) -or (Test-Path $key)) { exit 1 }

      - name: Testes da extensão
        run: node --test tests/extension_lib.test.cjs

      - name: Empacotar a extensão
        shell: pwsh
        run: Compress-Archive -Path extension/* -DestinationPath build/Release/extensao-download-manager.zip

      - name: SHA-256 do instalador (a atualização automática confere)
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/Release/DownloadManager-Setup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/build/Release/DownloadManager-Setup.exe.sha256", "$hash  DownloadManager-Setup.exe`n")
          Get-Content build/Release/DownloadManager-Setup.exe.sha256

      - name: Publicar executáveis
        uses: actions/upload-artifact@v5
        with:
          name: DownloadManager
          path: |
            build/Release/DownloadManager-Setup.exe
            build/Release/DownloadManager-Setup.exe.sha256
            build/Release/DownloadManager.exe
            build/Release/dm-cli.exe
            build/Release/dm-host.exe
            build/Release/extensao-download-manager.zip

      - name: Criar o release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = @("build/Release/DownloadManager-Setup.exe", "build/Release/DownloadManager-Setup.exe.sha256",
                     "build/Release/extensao-download-manager.zip")
          if (Test-Path firefox/download-manager.xpi) { $files += "firefox/download-manager.xpi" }
          gh release create $env:RELEASE_TAG @files --target "${{ github.sha }}" --title "Download Manager $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit 1 }
